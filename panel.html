<!doctype html>
<html>
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="panel.css">
</head>
<body>
<header>
  <strong>AI Debugging Companion</strong>
  <span id="count" class="muted"></span>
  <div class="actions">
    <button id="auditBtn">Audit page</button>
    <button id="elBtn">Explain selected element</button>
    <button id="clearBtn">Clear</button>
    <button id="settingsBtn" title="Settings">&#9881;</button>
  </div>
</header>

<section id="settings" hidden>
  <label>Anthropic API key <input id="apiKey" type="password" placeholder="sk-ant-..."></label>
  <label>Model <input id="model" placeholder="claude-sonnet-5-5"></label>
  <button id="saveBtn">Save</button>
  <p class="muted">Stored only in this browser (chrome.storage.local). Without a key, built-in quick hints still work.</p>
</section>

<main>
  <h3>Issues</h3>
  <ul id="issues"><li class="muted">Listening for console errors, exceptions and failed requests. Reload the page to catch early ones.</li></ul>
  <h3>AI answer</h3>
  <div id="out" class="muted">Pick an issue and press "Explain with AI".</div>
</main>

<footer>
  <input id="ask" placeholder="Ask anything about this page...">
  <button id="askBtn">Ask</button>
</footer>
<script src="panel.js"></script>
</body>
</html>
